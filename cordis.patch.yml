# The restart-button bundle patch.
#
# Adding `dsh-restart-button` to a profile's `dsh.profile.bundles` applies this
# automatically — there is no YAML for a user to hand-write.
#
# The entry name is the BARE package name deliberately: a package specifier is
# what the loader resolves, and a subpath entry name fails that resolve.
#
# Every value is optional; the defaults are the recommended behaviour.
# `restartDelayMs` is the interesting one: it is the pause between the command
# returning and the shell being terminated, so the command's own result row
# reaches the session log before the process that would write it goes away.
- insert:
    - id: restart-button
      name: dsh-restart-button
      config:
        enabled: true
        restartDelayMs: 900
